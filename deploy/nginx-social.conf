# KoGaMaZ - общий соц-сервер за nginx.
#
# Кусок для блока server { } того же vhost, что и игровой сервер. Лаунчер
# спрашивает https://<домен>/social, поэтому префикс /social/ срезается при
# проксировании: /social/api/health превращается в /api/health.
#
# Длиннейшее совпадение побеждает в nginx, поэтому /social/ не перехватывает
# /api/... игрового сервера, который лежит в корне.

location = /social { return 301 /social/; }

location /social/ {
    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Посты до 500 символов, чат до 1000, обложка мира - jpeg до 256 КБ в
    # base64 (это примерно 340 КБ на проводе). Двух мегабайт хватает с запасом.
    client_max_body_size 2m;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
